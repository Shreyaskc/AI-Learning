  <script>
    // Apply the saved theme before first paint, to avoid a flash of the wrong theme.
    (function () {
      try {
        var store = JSON.parse(localStorage.getItem("ai-fluency-v1") || "{}");
        if (store.theme === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
